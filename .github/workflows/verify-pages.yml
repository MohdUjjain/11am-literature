name: Verify Literature website publication

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: literature-c3-validation-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Rebuild and verify hosting assets
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout publication sources
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic preview-image renderer
        run: python -m pip install Pillow==12.3.0
      - name: Rebuild the social preview and content-hashed offline worker
        run: |
          python scripts/render_social.py
          python scripts/build.py
      - name: Verify the zipped source rebuild
        run: python scripts/verify_source_archive.py
      - name: Prove full source-to-publication equivalence
        run: python scripts/rebuild_published_reader.py
      - name: Guard source fidelity against restored editorial warnings
        run: python tests/test_source_fidelity.py
      - name: Validate publication metadata and files
        run: python tests/verify_publication.py
      - name: Simulate offline install, navigation and failed updates
        run: node tests/test_service_worker.mjs
      - name: Regression — optional offline assets must not block reader
        run: node tests/test_optional_precache.mjs
      - name: Verify continuous book progress and individual reading rings
        run: node tests/test_reading_progress.mjs
      - name: Verify search index and navigation UI
        run: node tests/test_reader_navigation.mjs
      - name: Verify Pass A reliable resume, hidden sections, and drawer focus
        run: node tests/test_pass_a.mjs
      - name: Check Pass B accessible colors, mobile search and icon semantics
        run: node tests/test_reader_polish.mjs
      - name: Verify offline refresh and update status logic
        run: node tests/test_offline_refresh.mjs
      - name: Run browser-level viewport and navigation checks
        run: |
          npm install --no-save --ignore-scripts playwright@1.58.2
          npx playwright install --with-deps chromium
          node tests/browser_smoke.mjs
          node tests/batch2_continuity.mjs
          node tests/batch4_edition_migration.mjs
          node tests/mobile_table_audit.mjs
      - name: Reproduce reported Reading 22 print failure and 13-reading revision export
        run: node tests/print_regression.mjs
      - name: Upload browser screenshots for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: literature-chromium-smoke
          path: test-artifacts/
          if-no-files-found: ignore
      - name: Verify reproducible worker and unchanged preview (pull requests)
        if: github.event_name == 'pull_request'
        run: |
          python scripts/build.py --check
          git diff --exit-code -- og-image.png
          # The worker is regenerated and committed by the main-branch job.
          # Reader-source PRs do not need to check in an interim stale worker.
  publish-assets:
    name: Publish verified generated assets
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.3.0
      - name: Rebuild generated website assets
        run: |
          python scripts/render_social.py
          python scripts/build.py
      - name: Commit generated assets only if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- service-worker.js og-image.png
          if git diff --cached --quiet; then
            echo 'Publishing assets are current.'
          else
            git commit -m 'Regenerate Literature publication assets'
            git push origin HEAD:main
          fi
